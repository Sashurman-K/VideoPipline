server:
  port: 8080

jwt:
  secret: ${JWT_SECRET_KEY}
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-auth-route
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**

            - id: user-service-route
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/users/**
              filters:
                - JwtAuthFilter

            - id: upload-service-route
              uri: ${UPLOAD_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/videos/**
              filters:
                - JwtAuthFilter
            - id: splitter-service-route
              uri: ${SPLITTER_SERVICE_URL:http://localhost:8083}
              predicates:
                  - Path=/api/v1/splitt/**
              filters:
                  - JwtAuthFilter

            - id: ai-service-route
              uri: ${AI_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/analysis/**
              filters:
                - JwtAuthFilter