server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    org.flywaydb: DEBUG
    org.springframework.web: DEBUG
    org.hibernate: DEBUG
    org.springframework.boot.autoconfigure.flyway: DEBUG
    org.springframework.boot.autoconfigure.condition: DEBUG

aws:
  access-key: ${AWS_ACCESS_KEY}
  secret-key: ${AWS_SECRET_KEY}
  region: ${AWS_REGION}
  raw-bucket-name: ${AWS_RAW_BUCKET_NAME}
  processed-bucket-name: ${AWS_PROCESSED_BUCKET_NAME}
  endpoint: ${AWS_ENDPOINT}

jwt:
  secret: ${JWT_SECRET_KEY}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

spring:
  application:
    name: upload-service
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  datasource:
    url: jdbc:postgresql://${UPLOAD_DB_HOST:localhost}:${UPLOAD_DB_PORT:5432}/${UPLOAD_DB_NAME}
    username: ${UPLOAD_DB_USER}
    password: ${UPLOAD_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    schemas: public
    baseline-on-migrate: true
    baseline-version: 1
    fail-on-missing-locations: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: ${KAFKA_UPLOAD_GROUP_ID:upload-group}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
pipeline:
  kafka:
    upload-topic: ${KAFKA_UPLOAD_TOPIC_NAME:video-upload-event-topic}
    processing-topic: ${KAFKA_PROCESSING_TOPIC_NAME:video-processing-event-topic}
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
    min-isr: ${KAFKA_TOPIC_MIN_ISR:1}
