services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-broker
    env_file:
      - env/kafka.env
    ports:
      - "${KAFKA_PORT:-29092}:9092"
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline-network
  cloudbeaver:
    image: dbeaver/cloudbeaver:24.0.0
    container_name: cloudbeaver
    ports:
      - "${CLOUDBEAVER_PORT}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks:
      - pipeline-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "${KAFKA_UI_PORT}:8080"
    depends_on:
      - kafka
    env_file:
      - env/kafka.env
    networks:
      - pipeline-network

  postgres-user-db:
    image: postgres:17-alpine
    container_name: pipeline-postgres-userdb
    env_file:
      - user-service/user-service.env
    ports:
      - "${POSTGRES_USER_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pipeline-network

  postgres-uploud-db:
    image: postgres:17-alpine
    container_name: pipeline-postgres-uplouddb
    env_file:
      - upload-service/upload-service.env
    ports:
      - "${POSTGRES_UPLOAD_PORT}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - pipeline-network

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    env_file:
      - user-service/user-service.env
      - env/secure.env
      - env/ports.env
    ports:
      - "${USER_SERVICE_PORT}:${APP_PORT}"
    depends_on:
      - postgres-user-db
    networks:
      - pipeline-network

  upload-service:
    build:
      context: ./upload-service
    container_name: upload-service
    ports:
      - "${UPLOAD_SERVICE_PORT}:${APP_PORT}"
    env_file:
      - upload-service/upload-service.env
      - env/secure.env
      - env/ports.env
      - env/aws.env
    depends_on:
      kafka:
        condition: service_healthy
      postgres-upload-db:
        condition: service_healthy
    networks:
      - pipeline-network

  splitter-service:
    build:
      context: ./splitter-service
    container_name: splitter-service
    env_file:
      - env/secure.env
      - env/ports.env
      - env/aws.env
    ports:
      - "${SPLITTER_SERVICE_PORT}:${APP_PORT}"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - pipeline-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      - user-service
    networks:
      - pipeline-network

networks:
  pipeline-network:
    driver: bridge

volumes:
  postgres-data:
  cloudbeaver_data:
  kafka_data: